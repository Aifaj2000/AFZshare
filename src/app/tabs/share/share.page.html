<ion-content
  [fullscreen]="true"
  class="share-page">

  <div class="share-container">


    <!-- =================================================
         HEADER
    ================================================== -->

    <div class="page-header">

      <div class="title-section">

        <div class="title-icon">
          <ion-icon name="share-social-outline"></ion-icon>
        </div>

        <div>
          <h1>Offline File Sharing</h1>
          <p>Fast. Private. No internet required.</p>
        </div>

      </div>


      <!-- Help -->

      <button
        class="help-button"
        type="button"
        (click)="showHelp()">

        <ion-icon name="help-outline"></ion-icon>

      </button>

    </div>



    <!-- =================================================
         MAIN CONTENT
    ================================================== -->

    <div class="main-content">


      <!-- =================================================
           SEND CARD
      ================================================== -->

      <div
        class="action-card send-card"
        (click)="sendFile()">


        <div class="action-content">

          <div class="action-icon send-icon">

            <ion-icon
              name="arrow-up-outline">
            </ion-icon>

          </div>


          <div class="action-text">

            <span class="action-label">
              Send
            </span>

            <span class="action-description">
              Send files to a nearby device
            </span>

          </div>


          <div class="action-arrow">

            <ion-icon
              name="chevron-forward-outline">
            </ion-icon>

          </div>

        </div>


      </div>



      <!-- =================================================
           RECEIVE CARD
      ================================================== -->

      <div
        class="action-card receive-card"
        (click)="receiveFile()">


        <div class="action-content">


          <div class="action-icon receive-icon">

            <ion-icon
              name="arrow-down-outline">
            </ion-icon>

          </div>


          <div class="action-text">

            <span class="action-label">
              Receive
            </span>

            <span class="action-description">
              Receive files from a nearby device
            </span>

          </div>


          <div class="action-arrow">

            <ion-icon
              name="chevron-forward-outline">
            </ion-icon>

          </div>


        </div>

      </div>



      <!-- =================================================
           INFO
      ================================================== -->

      <div class="info-card">

        <ion-icon
          name="wifi-outline">
        </ion-icon>

        <div>

          <strong>
            Nearby sharing
          </strong>

          <p>
            Connect directly with nearby devices
            without using mobile data.
          </p>

        </div>

      </div>


    </div>



    <!-- =================================================
         INVITE
    ================================================== -->

    <div class="bottom-action">

  <ion-button
    shape="round"
    class="invite-btn"
    (click)="inviteFriends()">

    <ion-icon
      name="person-add-outline"
      slot="start">
    </ion-icon>

    Invite Friends

  </ion-button>

</div>

  </div>

</ion-content>
